name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts --config.auto-install-peers=false

      - name: Validate package metadata and sources
        run: |
          node -e "const p=require('./package.json'); if(!p.name||!p.main||!p.license) process.exit(1); if(p.dsh?.bundle?.patch !== './cordis.patch.yml') process.exit(1); if(!p.files.includes('scripts')) process.exit(1); console.log('package.json OK')"
          node --check lib/index.js
          node --check lib/bridge.js
          node -e "const fs=require('fs'); const s=fs.readFileSync('./cordis.patch.yml','utf8'); if(!s.includes('dsh-unity-mcp')) process.exit(1); fs.accessSync('vendor/mcp-unity-server/build/index.js'); console.log('bundle and vendor entry OK')"

      - name: Unit tests
        run: npm test

      - name: Vendor stdio smoke test
        run: npm run smoke -- vendor

      - name: Pack and test the published tarball
        shell: bash
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          TGZ="$RUNNER_TEMP/dsh-unity-mcp-1.1.0.tgz"
          TEST_HOME="$RUNNER_TEMP/installed-package"
          mkdir -p "$TEST_HOME"
          printf '{"private":true}\n' > "$TEST_HOME/package.json"
          pnpm add --dir "$TEST_HOME" --ignore-scripts --config.auto-install-peers=false "$TGZ"
          (cd "$TEST_HOME" && node "$TEST_HOME/node_modules/dsh-unity-mcp/scripts/smoke.mjs")
          test -f "$TEST_HOME/node_modules/dsh-unity-mcp/scripts/smoke.mjs"
          test -f "$TEST_HOME/node_modules/dsh-unity-mcp/vendor/mcp-unity-server/build/index.js"
